<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" routerLink="/">Reaper</a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                    Home
                </a>
                </li>
            </ul>

            <ul class="navbar-nav">
                @if (!auth.isLoggedIn()) {
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/login" routerLinkActive="active">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/register" routerLinkActive="active">Register</a>
                    </li>
                } @else {
                    <li class="nav-item dropdown">
                        <a class="nav-link d-flex align-items-center" role="button" (click)="toggleDropdown()">
                        <img src="https://via.placeholder.com/32" class="rounded-circle me-2" alt="Profile">

                        {{ auth.currentUser()?.username }}
                        </a>

                        <ul class="dropdown-menu" [class.show]="dropdownOpen()">
                            <li><a class="dropdown-item" routerLink="/dashboard" (click)="dropdownOpen.set(false)">Dashboard</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" role="button" (click)="logout()">Logout</a></li>
                        </ul>
                    </li>
                }
            </ul>
        </div>
    </div>
</nav>
