<div class="container mt-4" style="max-width: 400px;">
  <h2>Register</h2>
  <form (ngSubmit)="register()">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" class="form-control"
             [ngModel]="username()" (ngModelChange)="username.set($event)"
             name="username" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Email address</label>
      <input type="email" class="form-control"
             [ngModel]="email()" (ngModelChange)="email.set($event)"
             name="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Birthdate</label>
      <input type="date" class="form-control"
             [ngModel]="birthdate()" (ngModelChange)="birthdate.set($event)"
             name="birthdate" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control"
             [ngModel]="password()" (ngModelChange)="password.set($event)"
             name="password" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Confirm Password</label>
      <input type="password" class="form-control"
             [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)"
             name="confirmPassword" required>
    </div>
    
    @if (errorMessage()) {
      <div class="alert alert-danger">{{ errorMessage() }}</div>
    }

    <button type="submit" class="btn btn-primary">Register</button>
  </form>

  <div class="text-center mt-3">
    <span>Already have an account?</span>
    <a routerLink="/login" class="ms-1">Login</a>
  </div>
</div>
