<div class="sidebar">
  <button class="sidebar-btn" type="button">Direct Message</button>
  <button class="sidebar-btn" type="button">Groups</button>

  <div class="sidebar-spacer"></div>

  @if (userRole() === 'groupAdmin') {
    <button class="sidebar-btn" type="button">Group Settings</button>
  } @else if (userRole() === 'superAdmin') {
    <button class="sidebar-btn" type="button">Super Admin Settings</button>
  }

  <a class="sidebar-btn btn" routerLink="/request">Request</a>
  <button class="sidebar-btn" type="button">Settings</button>
  <button class="sidebar-btn" type="button" (click)="logout()">Logout</button>
</div>
